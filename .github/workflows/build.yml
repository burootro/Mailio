name: Build Mailio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # لو فيه keystore محفوظ نستخدمه، لو مفيش نعمل واحد جديد
      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "استخدام الـ keystore المحفوظ"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/mailio.keystore
          else
            echo "توليد keystore جديد"
            keytool -genkeypair -v \
              -keystore app/mailio.keystore \
              -storepass mailio2026 \
              -keypass mailio2026 \
              -alias mailio \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mailio, OU=Mobile, O=Burootro, L=Cairo, S=Cairo, C=EG"
          fi

      - name: Print SHA-1 fingerprint
        run: |
          echo "=================================================="
          echo "               SHA-1 FINGERPRINT"
          echo "=================================================="
          keytool -list -v \
            -keystore app/mailio.keystore \
            -storepass mailio2026 \
            -alias mailio | grep -A 1 "SHA1:"
          echo "=================================================="

      # طباعة الـ keystore كنص — انسخه وحطه في GitHub Secrets
      - name: Print keystore for saving
        run: |
          echo "=================================================="
          echo "        KEYSTORE BASE64 - انسخ اللي تحت ده"
          echo "=================================================="
          base64 -w 0 app/mailio.keystore
          echo ""
          echo "=================================================="

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mailio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
