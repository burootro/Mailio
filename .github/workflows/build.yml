name: Build Mailio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore keystore
        env:
          SAVED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SAVED_KEYSTORE" ]; then
            echo "KEYSTORE_BASE64 secret is missing"
            exit 1
          fi
          printf '%s' "$SAVED_KEYSTORE" | base64 -d > app/mailio.keystore
          echo "Keystore restored"

      - name: Verify SHA-1
        run: keytool -list -v -keystore app/mailio.keystore -storepass mailio2026 -alias mailio | grep "SHA1:"

      # Release build = R8 shrinking -> much smaller and faster APK
      - name: Build release APK
        run: gradle assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Mailio-${{ github.run_number }}.apk"
          ls -la out

      # Published as a GitHub Release (artifact storage quota is full)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/*.apk \
            --title "Mailio #${{ github.run_number }}" \
            --notes "Automatic build from ${{ github.sha }}"
