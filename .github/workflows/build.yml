name: Build Mailio APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Create keystore
        env:
          SAVED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SAVED_KEYSTORE" ]; then
            echo "توليد keystore جديد"
            keytool -genkeypair -v \
              -keystore app/mailio.keystore \
              -storepass mailio2026 \
              -keypass mailio2026 \
              -alias mailio \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Mailio, OU=Mobile, O=Burootro, L=Cairo, S=Cairo, C=EG"
          else
            echo "استخدام الـ keystore المحفوظ"
            printf '%s' "$SAVED_KEYSTORE" | base64 -d > app/mailio.keystore
          fi

      - name: Print SHA-1 fingerprint
        run: |
          echo "=== SHA-1 ==="
          keytool -list -v -keystore app/mailio.keystore -storepass mailio2026 -alias mailio | grep "SHA1:"

      - name: Print keystore base64
        run: |
          echo "=== KEYSTORE BASE64 ==="
          base64 -w 0 app/mailio.keystore
          echo ""
          echo "=== END ==="

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mailio-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
